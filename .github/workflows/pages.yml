name: Controleer en publiceer Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bouw voor Pages
        env:
          CONFIGURED_BASE: ${{ vars.BASE_PATH }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CONFIGURED_BASE" ]; then
            export BASE_PATH="$CONFIGURED_BASE"
          elif [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/$REPOSITORY_NAME/"
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer
        id: deployment
        uses: actions/deploy-pages@v4